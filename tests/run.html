<!doctype html>
<meta charset="utf-8">
<title>Tests MatDora</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #222; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #summary { font-weight: 700; margin: 8px 0 12px; }
  .pass { color: #1b7a3a; }
  .fail { color: #b3261e; }
  table { border-collapse: collapse; }
  td { padding: 2px 10px 2px 0; vertical-align: top; }
  #frames { position: absolute; left: -10000px; top: 0; }
  iframe { border: 0; display: block; }
</style>
<h1>Tests MatDora</h1>
<p>Servir le dossier en HTTP (<code>python -m http.server 8000</code>) puis ouvrir <code>http://localhost:8000/tests/run.html</code>.</p>
<div id="summary">Tests en cours…</div>
<table id="results"></table>
<div id="frames"></div>

<script>
  // Tailles d'écran testées : ordinateurs, tablettes Fire (Silk), téléphones
  const VIEWPORTS = [
    [1920, 1080], [1366, 768], [1280, 800], [800, 1280],
    [768, 1024], [412, 915], [375, 812], [375, 667], [360, 640]
  ];
  const results = [];
  const RUN = Date.now().toString(36);
  // Config Supabase réelle (pour #live), lue dans config.js sans l'exécuter dans cette page
  window.MATDORA_LIVE_CONFIG = null;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // Attend qu'une condition soit vraie (les onglets en arrière-plan ralentissent les minuteries)
  async function waitFor(cond, timeout = 4000) {
    const end = Date.now() + timeout;
    while (Date.now() < end) {
      try { if (cond()) return true; } catch (e) { /* pas encore prêt */ }
      await sleep(50);
    }
    return false;
  }

  function check(group, name, ok, detail = "") {
    results.push({ group, name, ok: !!ok, detail });
  }

  function load(src, w, h) {
    return new Promise((resolve, reject) => {
      const f = document.createElement("iframe");
      // ?v=… : toujours la dernière version des pages, jamais celle du cache
      f.width = w; f.height = h; f.src = src.replace(".html", ".html?v=" + RUN);
      f.onload = () => resolve(f);
      f.onerror = reject;
      document.getElementById("frames").appendChild(f);
    });
  }

  // Tout le contenu visible d'un bloc est dans le bloc (haut, bas, gauche, droite), même centré
  function fitsBox(box) {
    const r = box.getBoundingClientRect();
    return [...box.querySelectorAll("*")].every(el => {
      if (!el.getClientRects().length) return true;
      const e = el.getBoundingClientRect();
      return e.top >= r.top - 1 && e.bottom <= r.bottom + 1 && e.left >= r.left - 1 && e.right <= r.right + 1;
    });
  }

  async function adminLogin(aw, ad) {
    await aw.ready;
    if (!ad.getElementById("login").hidden) {
      ad.getElementById("login-user").value = "admin";
      ad.getElementById("login-pass").value = "admin";
      ad.getElementById("login-form").dispatchEvent(new aw.Event("submit", { cancelable: true }));
      await aw.ready;
    }
  }

  async function imagesReady(doc) {
    const imgs = [...doc.images].filter(i => i.getAttribute("src"));
    await Promise.all(imgs.map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; })));
    return imgs;
  }

  async function testViewport(w, h) {
    const g = `${w}×${h}`;
    // Mode démo : toutes les slides, y compris Happiness, Photos et Repas
    const f = await load("../index.html#mock", w, h);
    const win = f.contentWindow, doc = f.contentDocument;
    await win.document.fonts?.ready;
    await win.refresh();
    check(g, "les 7 slides sont dans la rotation", win.deck.count === 7, win.deck.ids.join(", "));
    const imgs = await imagesReady(doc);
    check(g, "script chargé (diaporama prêt)", typeof win.deck === "object");
    if (typeof win.deck !== "object") return;
    win.deck.pause(true);

    check(g, "toutes les images s'affichent", imgs.every(i => i.naturalWidth > 0),
      imgs.filter(i => !i.naturalWidth).map(i => i.getAttribute("src")).join(", "));

    const root = doc.documentElement;
    check(g, "pas de scroll vertical", root.scrollHeight <= win.innerHeight + 1, `${root.scrollHeight} > ${win.innerHeight}`);
    check(g, "pas de scroll horizontal", root.scrollWidth <= win.innerWidth + 1, `${root.scrollWidth} > ${win.innerWidth}`);

    // Chaque diapo : son contenu tient dans l'écran, rien n'est coupé
    for (let k = 0; k < win.deck.count; k++) {
      win.deck.show(k);
      const slide = doc.querySelectorAll(".slide")[k];
      const label = slide.getAttribute("aria-label");
      const active = doc.querySelectorAll(".slide.active");
      check(g, `diapo ${k + 1} (${label}) seule active`, active.length === 1 && active[0] === slide);
      const inner = slide.querySelector(".inner");
      if (inner) {
        check(g, `diapo ${k + 1} (${label}) : contenu non coupé`,
          inner.scrollHeight <= inner.clientHeight + 1 && inner.scrollWidth <= inner.clientWidth + 1,
          `${inner.scrollWidth}×${inner.scrollHeight} dans ${inner.clientWidth}×${inner.clientHeight}`);
        // Le contenu ne passe pas sous la barre de progression
        const bar = doc.getElementById("progress").getBoundingClientRect();
        const lowest = Math.max(...[...inner.querySelectorAll("*")]
          .filter(el => el.getClientRects().length && !el.closest("figure"))
          .map(el => el.getBoundingClientRect().bottom));
        check(g, `diapo ${k + 1} (${label}) : rien sous la barre de progression`, lowest <= bar.top + 6,
          `contenu jusqu'à ${Math.round(lowest)}px, barre à ${Math.round(bar.top)}px`);
      }
      // Rien ne dépasse à droite (texte trop long, grille trop large) ;
      // un élément rogné par un parent en overflow hidden (zoom des photos) ne compte pas
      const clipped = el => {
        for (let p = el.parentElement; p && p !== slide; p = p.parentElement) {
          if (win.getComputedStyle(p).overflow !== "visible") return p.getBoundingClientRect().right <= win.innerWidth + 1;
        }
        return false;
      };
      const wide = [...slide.querySelectorAll("*")].filter(el => {
        const r = el.getBoundingClientRect();
        return r.width && r.right > win.innerWidth + 1 && !el.classList.contains("bg") && !clipped(el);
      });
      check(g, `diapo ${k + 1} (${label}) : rien ne dépasse à droite`, wide.length === 0,
        wide.slice(0, 3).map(el => el.className || el.tagName).join(", "));
    }
    win.deck.show(0);
    f.remove();
  }

  async function testLogic() {
    const g = "logique";
    const f = await load("../index.html#off", 1280, 800);
    const win = f.contentWindow, doc = f.contentDocument;
    const TARGET = win.eval("TARGET");

    const fmt = new Intl.DateTimeFormat("fr-FR", { timeZone: "Europe/Paris", weekday: "long", day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const when = fmt.format(TARGET);
    check(g, "cible = dimanche 8 novembre 2026, 10:00 heure de Paris", when === "dimanche 8 novembre 2026 à 10:00", when);

    const shown = ["d", "h", "m", "s"].map(id => Number(doc.getElementById(id).textContent));
    const shownSec = shown[0] * 86400 + shown[1] * 3600 + shown[2] * 60 + shown[3];
    const expected = Math.max(0, Math.floor((TARGET - Date.now()) / 1000));
    check(g, "compte à rebours juste (±2 s)", Math.abs(shownSec - expected) <= 2, `affiché ${shownSec} s, attendu ${expected} s`);
    check(g, "heures/minutes/secondes dans les bornes", shown[1] < 24 && shown[2] < 60 && shown[3] < 60, shown.join(":"));

    // Textes clés
    const text = doc.body.textContent;
    for (const word of ["Matthieu", "Dounia", "Dora", "Eurasier", "Dimanche", "Prochaine pause"]) {
      check(g, `le texte mentionne « ${word} »`, text.includes(word));
    }

    // Pile de photos : toucher change de photo, sans changer de slide
    win.deck.pause(true);
    win.deck.show(0);
    const topBefore = doc.querySelector('figure[data-pos="0"] img').getAttribute("src");
    doc.getElementById("stack").dispatchEvent(new win.PointerEvent("pointerup", { bubbles: true }));
    await sleep(1100);
    const topAfter = doc.querySelector('figure[data-pos="0"] img').getAttribute("src");
    check(g, "toucher la pile change de photo", topAfter !== topBefore, `${topBefore} → ${topAfter}`);
    check(g, "toucher la pile ne change pas de slide", win.deck.index === 0, `index ${win.deck.index}`);
    check(g, "la pile garde 3 photos bien rangées", ["0", "1", "2"].every(p => doc.querySelectorAll(`figure[data-pos="${p}"]`).length === 1));

    // Slide Pause : prochaine pause selon l'heure (10:00, 12:00, 16:00, lundi → vendredi)
    const at = s => new win.Date(s);  // dates locales, comme sur l'écran
    const hm = t => `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
    const cases = [
      ["mardi 08:00 → 10:00 aujourd'hui", "2026-11-03T08:00:00", "2026-11-03", "10:00", "Aujourd'hui"],
      ["mardi 10:00 pile → 12:00", "2026-11-03T10:00:00", "2026-11-03", "12:00", "Aujourd'hui"],
      ["mardi 11:59 → 12:00", "2026-11-03T11:59:00", "2026-11-03", "12:00", "Aujourd'hui"],
      ["mardi 13:00 → 16:00", "2026-11-03T13:00:00", "2026-11-03", "16:00", "Aujourd'hui"],
      ["mardi 17:00 → demain 10:00", "2026-11-03T17:00:00", "2026-11-04", "10:00", "Demain"],
      ["vendredi 17:00 → lundi 10:00", "2026-11-06T17:00:00", "2026-11-09", "10:00", "Lundi"],
      ["samedi 11:00 → lundi 10:00", "2026-11-07T11:00:00", "2026-11-09", "10:00", "Lundi"],
      ["dimanche 23:00 → demain 10:00", "2026-11-08T23:00:00", "2026-11-09", "10:00", "Demain"],
    ];
    for (const [name, now, date, time, label] of cases) {
      const t = win.nextPause(at(now));
      const gotDate = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
      const gotLabel = win.dayLabel(t, at(now));
      check(g, `pause : ${name}`, gotDate === date && hm(t) === time && gotLabel === label, `${gotLabel} ${gotDate} ${hm(t)}`);
    }

    // Affichage de la slide Pause à un instant donné
    win.renderPause(at("2026-11-03T10:36:20"));
    check(g, "pause affichée : 12:00", doc.getElementById("pause-time").textContent === "12:00", doc.getElementById("pause-time").textContent);
    check(g, "pause affichée : dans 1 h 23 min 40 s", doc.getElementById("pause-in").textContent === "dans 1 h 23 min 40 s", doc.getElementById("pause-in").textContent);
    const states = [...doc.querySelectorAll("#pause-list li")].map(li => `${li.textContent}:${li.className || "à venir"}`).join(" ");
    check(g, "pauses du jour : 10:00 passée, 12:00 prochaine, 16:00 à venir", states === "10:00:past 12:00:next 16:00:à venir", states);
    win.renderPause(at("2026-11-03T11:59:30"));
    check(g, "moins d'une heure : dans 0 min 30 s", doc.getElementById("pause-in").textContent === "dans 0 min 30 s", doc.getElementById("pause-in").textContent);
    win.renderPause(at("2026-11-06T17:00:00"));
    check(g, "vendredi soir : lundi, dans 2 j 17 h 00 min", doc.getElementById("pause-day").textContent === "Lundi" && doc.getElementById("pause-in").textContent === "dans 2 j 17 h 00 min",
      `${doc.getElementById("pause-day").textContent} / ${doc.getElementById("pause-in").textContent}`);
    win.renderPause();

    // Slide Imputations
    check(g, "slide Imputations : Jira TTE et Jira CGI affichés", text.includes("Jira TTE") && text.includes("Jira CGI"));
    const jira = now => { win.renderJira(at(now)); return `${doc.getElementById("jira-day").textContent} | ${doc.getElementById("jira-hint").textContent}`; };
    let j = jira("2026-11-03T15:00:00");
    check(g, "imputations un mardi : date + saisir la journée", j === "Mardi 3 novembre | Saisis ta journée avant de partir.", j);
    j = jira("2026-11-06T15:00:00");
    check(g, "imputations un vendredi : vérifier la semaine", j === "Vendredi 6 novembre | C'est vendredi : vérifie toute ta semaine avant de partir.", j);
    j = jira("2026-11-07T15:00:00");
    check(g, "imputations le week-end : rappel pour lundi", j.endsWith("Lundi matin, pense à vérifier ta semaine passée."), j);
    win.renderJira();

    // Barre de progression : couleur adaptée à chaque slide
    const tones = [];
    for (let k = 0; k < win.deck.count; k++) { win.deck.show(k); tones.push(doc.body.dataset.tone); }
    check(g, "barre de progression : couleur selon la slide", tones.join(",") === "light,dark,ink,violet", tones.join(","));

    // Slide RDV
    check(g, "slide RDV : Matthieu Hunel et Teams affichés", text.includes("Matthieu Hunel") && text.includes("Teams"));
    const steps = [...doc.querySelectorAll(".steps li")].map(li => li.innerText.replace(/\s+/g, " ").trim());
    check(g, "slide RDV : mention « ce n'est pas qu'il ne vous aime pas »", text.includes("Ce n'est pas qu'il ne vous aime pas"));
    check(g, "anti-veille : présent et sans erreur", typeof win.keepAwake === "function" && (await win.keepAwake(), true));
    check(g, "slide RDV : étapes lisibles, espaces compris", steps.join(" / ") === "Ouvre Teams / Écris à Matthieu Hunel / Propose-lui un créneau", steps.join(" / "));
    win.deck.show(0);

    // Compatibilité vieux Silk / vieux Chromium : pas de syntaxe ou de CSS trop récents
    const src = await (await fetch("../index.html", { cache: "no-store" })).text();
    const css = src.slice(src.indexOf("<style>"), src.indexOf("</style>"));
    const js = src.slice(src.lastIndexOf("<script>"), src.lastIndexOf("<\/script>"));
    check(g, "Silk : pas de « inset » en CSS (Chrome < 87)", !/\binset\s*:/.test(css));
    const flexGap = [...css.matchAll(/\{[^}]*display:\s*flex[^}]*\}/g)].filter(m => /[^-]gap\s*:/.test(m[0]));
    check(g, "Silk : pas de « gap » sur du flex (Chrome < 84)", flexGap.length === 0, flexGap.map(m => m[0].slice(0, 60)).join(" / "));
    check(g, "Silk : pas de ?. ni ?? en JavaScript (Chrome < 80)", !/\?\.|\?\?/.test(js));
    check(g, "Silk : pas de backdrop-filter", !/backdrop-filter/.test(css));

    // Navigation
    const d = win.deck;
    d.pause(true);
    d.show(0); d.next();
    check(g, "suivante : 1 → 2", d.index === 1);
    d.show(d.count - 1); d.next();
    check(g, "suivante après la dernière revient à la 1re", d.index === 0);
    d.prev();
    check(g, "précédente depuis la 1re va à la dernière", d.index === d.count - 1);
    win.document.dispatchEvent(new win.KeyboardEvent("keydown", { key: "ArrowRight" }));
    check(g, "flèche droite = suivante", d.index === 0);

    // Rotation automatique
    d.pause(false);
    d.duration = 300;
    d.show(0);
    await waitFor(() => d.index === 1, 15000);
    check(g, "rotation automatique toute seule", d.index === 1, `index ${d.index}`);
    // Relance une minuterie neuve : dans un onglet caché, Chrome bride les minuteries enchaînées à 1/min
    d.show(d.index);
    await waitFor(() => d.index === 2 % d.count, 15000);
    check(g, "la rotation continue (et reboucle)", d.index === 2 % d.count, `index ${d.index}`);
    d.pause(true);
    const before = d.index;
    await sleep(450);
    check(g, "pause = plus de rotation", d.index === before);

    // État final quand Dora est arrivée
    win.eval("render(TARGET + 1000)");
    check(g, "après dimanche 10 h : message d'arrivée visible", !doc.getElementById("done").hidden && doc.getElementById("clock").hidden);
    f.remove();

    // Mode Silk
    const fs = await load("../index.html#off,simple", 1280, 800);
    check(g, "mode simple (Silk) activé avec #simple", fs.contentDocument.documentElement.classList.contains("simple"));
    const pic = fs.contentDocument.querySelector("figure img");
    check(g, "mode simple : pas de zoom sur les photos", fs.contentWindow.getComputedStyle(pic).animationName === "none");
    fs.remove();
  }

  // Données dynamiques en mode démo : écran, page de vote et dashboard ensemble
  async function testData() {
    const g = "données (démo)";
    localStorage.removeItem("matdora-demo");

    // Sans Supabase ni #mock : l'écran garde ses 4 slides fixes
    const off = await load("../index.html#off", 1280, 800);
    check(g, "sans configuration : 4 slides fixes seulement", off.contentWindow.deck.ids.join() === "dora,pause,jira,rdv", off.contentWindow.deck.ids.join());
    off.remove();

    // Écran en mode démo
    const tv = await load("../index.html#mock", 1280, 800);
    const tw = tv.contentWindow, td = tv.contentDocument;
    tw.deck.pause(true);
    await tw.refresh();
    check(g, "écran : 7 slides avec les données", tw.deck.ids.join() === "dora,pause,jira,rdv,happiness,photos,lunch", tw.deck.ids.join());
    check(g, "happiness : titre de l'event affiché", td.getElementById("happy-title").textContent.indexOf("apéro") !== -1, td.getElementById("happy-title").textContent);
    check(g, "happiness : compte à rebours affiché", /^dans \d/.test(td.getElementById("happy-in").textContent), td.getElementById("happy-in").textContent);
    const lunchRows = () => [...td.querySelectorAll("#lunch-list li")].map(li => li.textContent.replace(/\s+/g, " ").trim());
    check(g, "repas : les choix du jour affichés", lunchRows().length === 3 && lunchRows().join("|").indexOf("Pizzeria") !== -1, lunchRows().join(" | "));
    check(g, "repas : plus de votes ni de QR code", !td.querySelector(".lunch-count, .lunch-bar, .qr, #qr-vote, #qr-photos") && !/vote/i.test(td.getElementById("lunch-inner").textContent));
    // Mosaïque : plusieurs photos à la fois
    const tilesShown = () => [...td.querySelectorAll("#gallery .tile")].map(t => {
      const on = t.querySelector("img.on");
      return on ? on.getAttribute("src") : null;
    });
    await waitFor(() => tilesShown().every(Boolean));
    check(g, "photos : les 3 photos affichées en même temps", td.querySelectorAll("#gallery .tile").length === 3 && tilesShown().every(Boolean) && new Set(tilesShown()).size === 3, tilesShown().join(", "));
    check(g, "photos : légendes sur les cases", [...td.querySelectorAll("#gallery .tile-cap")].every(c => c.textContent.indexOf("Exemple") !== -1));
    check(g, "photos : 3 photos = 1 grande + 2 petites", td.getElementById("gallery").dataset.count === "3");

    // 9 photos : 5 cases, et les photos tournent sans doublon à l'écran
    const fake = Array.from({ length: 9 }, (_, i) => ({ id: "f" + i, url: `../img/${(i % 3) + 1}.jpg?${i}`, caption: "Photo " + i, event: "Test" }));
    tw.setEventPhotos(fake);
    await waitFor(() => tilesShown().every(Boolean));
    check(g, "photos : 9 photos → 5 cases (1 grande + 4 petites)", td.querySelectorAll("#gallery .tile").length === 5 && td.getElementById("gallery").dataset.count === "5");
    const before = tilesShown().join();
    const seen = new Set(tilesShown());
    let dupes = false;
    for (let k = 0; k < 9; k++) {
      tw.swapTile();
      await waitFor(() => new Set(tilesShown()).size === 5, 2000);
      const now = tilesShown();
      if (new Set(now).size !== now.length) dupes = true;
      now.forEach(u => seen.add(u));
    }
    check(g, "photos : une case change à la fois, sans doublon à l'écran", !dupes && tilesShown().join() !== before, tilesShown().join(", "));
    check(g, "photos : toutes les photos finissent par passer", seen.size === 9, `${seen.size} / 9`);
    const captions = [...td.querySelectorAll("#gallery .tile-cap")].map(c => c.textContent);
    const shownNames = tilesShown().map(u => "Photo " + u.split("?")[1]);
    check(g, "photos : chaque légende va avec sa photo", captions.every((c, k) => c.endsWith(shownNames[k])), captions.join(" | "));
    // Retour aux photos de la démo
    tw.eval("eventPhotos = []");
    await tw.refresh();
    const happyEmpty = await (async () => {
      tw.eval("happiness = null"); tw.renderHappiness();
      const t = td.getElementById("happy-title").textContent;
      return t;
    })();
    check(g, "happiness sans event : « arrive bientôt »", happyEmpty === "Le prochain event arrive bientôt", happyEmpty);

    // Une proposition du jour ajoutée dans le dashboard s'affiche avec les autres
    await tw.MatDoraStore.propose(tw.MatDoraStore.today(), "Resto du test");
    await tw.refresh();
    check(g, "écran : une proposition du jour s'ajoute aux choix", lunchRows().length === 4 && lunchRows().indexOf("Resto du test") !== -1, lunchRows().join(" | "));

    // Dashboard
    const adm = await load("../admin.html#mock", 1280, 900);
    const aw = adm.contentWindow, ad = adm.contentDocument;
    await adminLogin(aw, ad);
    check(g, "dashboard : mode démo indiqué", ad.getElementById("mode").textContent === "Mode démo (#mock)");
    check(g, "dashboard : 7 slides listées", ad.querySelectorAll("#slides-list .row").length === 7);
    ad.getElementById("slide-jira").click();
    ad.getElementById("slides-save").click();
    await sleep(400);
    await tw.refresh();
    check(g, "dashboard → écran : slide décochée retirée", tw.deck.ids.indexOf("jira") === -1 && tw.deck.count === 6, tw.deck.ids.join());

    ad.querySelector('[data-tab="pauses"]').click();
    check(g, "dashboard : onglet Pauses s'ouvre", !ad.getElementById("tab-pauses").hidden && ad.getElementById("tab-slides").hidden);
    check(g, "dashboard : 7 jours dans l'onglet Pauses", ad.querySelectorAll("#pauses-list .day-row").length === 7);
    check(g, "dashboard : week-end sans pause par défaut", ad.querySelectorAll("#pauses-list .no-pause").length === 2);
    const setTime = (id, v) => { const el = ad.getElementById(id); el.value = v; el.dispatchEvent(new aw.Event("change")); };
    // Lundi : 09:30 au lieu de 10:00
    setTime("pause-1-0", "09:30");
    // Mercredi : plus aucune pause
    while (ad.querySelector("#pause-3-0")) ad.querySelector("#pause-3-0").nextElementSibling.click();
    // Samedi : une pause ajoutée (10:00 par défaut), passée à 11:15
    ad.getElementById("pause-add-6").click();
    check(g, "dashboard : ajouter une pause un samedi", !!ad.getElementById("pause-6-0") && ad.getElementById("pause-6-0").value === "10:00");
    setTime("pause-6-0", "11:15");
    // Vendredi : une 4e pause ajoutée après 16:00 → 18:00
    ad.getElementById("pause-add-5").click();
    check(g, "dashboard : nouvelle pause 2 h après la dernière", ad.getElementById("pause-5-3").value === "18:00", ad.getElementById("pause-5-3").value);
    ad.getElementById("pauses-save").click();
    await sleep(400);
    await tw.refresh();
    const at2 = s2 => new tw.Date(s2);
    const hm2 = t => t ? `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")} ${t.getDate()}` : "aucune";
    const np = s2 => hm2(tw.nextPause(at2(s2)));

    }
    tv.width = 1280; tv.height = 720;
    await sleep(250);

    ad.getElementById("happy-image-remove").click();
    await save();
    check(g, "image retirée : plus affichée", !visible(td.getElementById("happy-img")) && !td.getElementById("happy-inner").classList.contains("has-image"));

    // Un élément masqué l'est vraiment, sur les 2 pages (sans dépendre d'un style externe)
    for (const [name, doc, win] of [["écran", td, tw], ["dashboard", ad, aw]]) {
      const leaks = [...doc.querySelectorAll("[hidden]")].filter(el => win.getComputedStyle(el).display !== "none");
      check(g, `${name} : tout élément masqué est vraiment caché`, leaks.length === 0, leaks.map(el => el.id || el.className).join(", "));
    }
    adm.remove();
    tv.remove();
    localStorage.removeItem("matdora-demo");
  }

  // Sécurité en mode démo : connexion au dashboard et code d'accès du site
  async function testAccess() {
    const g = "accès (démo)";
    localStorage.removeItem("matdora-demo");
    localStorage.removeItem("matdora-admin");
    localStorage.removeItem("matdora-site-code");

    // Dashboard : connexion obligatoire
    let adm = await load("../admin.html#mock", 1280, 900);
    let aw = adm.contentWindow, ad = adm.contentDocument;
    await aw.ready;
    check(g, "dashboard : écran de connexion, rien d'autre", !ad.getElementById("login").hidden && ad.getElementById("app").hidden);
    ad.getElementById("login-user").value = "admin";
    ad.getElementById("login-pass").value = "mauvais";
    ad.getElementById("login-form").dispatchEvent(new aw.Event("submit", { cancelable: true }));
    await aw.ready;
    check(g, "dashboard : mauvais mot de passe refusé", ad.getElementById("app").hidden && ad.getElementById("login-error").textContent === "Identifiant ou mot de passe incorrect.", ad.getElementById("login-error").textContent);
    ad.getElementById("login-pass").value = "admin";
    ad.getElementById("login-form").dispatchEvent(new aw.Event("submit", { cancelable: true }));
    await aw.ready;
    check(g, "dashboard : bon mot de passe → dashboard", !ad.getElementById("app").hidden && ad.getElementById("login").hidden && ad.getElementById("who-name").textContent === "admin");
    adm.remove();
    adm = await load("../admin.html#mock,access", 1280, 900);
    aw = adm.contentWindow; ad = adm.contentDocument;
    await aw.ready;
    check(g, "dashboard : reste connecté en rechargeant", !ad.getElementById("app").hidden);
    check(g, "dashboard : onglet Accès, pas de code au départ", !ad.getElementById("tab-access").hidden && ad.getElementById("code-state").textContent.indexOf("Aucun code") === 0);

    // Écran ouvert tant qu'aucun code n'est réglé
    let tv = await load("../index.html#mock", 1280, 720);
    let tw = tv.contentWindow, td = tv.contentDocument;
    await tw.refresh();
    check(g, "écran sans code réglé : ouvert", td.getElementById("lock").hidden);
    tv.remove();

    // L'admin règle un code
    ad.getElementById("code-new").value = "abc";
    ad.getElementById("code-form").dispatchEvent(new aw.Event("submit", { cancelable: true }));
    await sleep(100);
    check(g, "code trop court refusé", ad.getElementById("toast").classList.contains("error"));
    ad.getElementById("code-new").value = "dora2026";
    ad.getElementById("code-form").dispatchEvent(new aw.Event("submit", { cancelable: true }));
    await waitFor(() => ad.getElementById("code-state").textContent.indexOf("Un code") === 0);
    check(g, "code enregistré dans le dashboard", ad.getElementById("code-state").textContent.indexOf("Un code est demandé") === 0);

    // Une TV qui ne connaît pas le code
    localStorage.removeItem("matdora-site-code");
    tv = await load("../index.html#mock", 1280, 720);
    tw = tv.contentWindow; td = tv.contentDocument;
    await tw.refresh();
    const lock = td.getElementById("lock");
    check(g, "écran : demande le code", !lock.hidden && tw.getComputedStyle(lock).display !== "none" && !td.getElementById("lock-form").hidden);
    const idxLocked = tw.deck.index;
    tw.deck.duration = 300;
    await sleep(1200);
    check(g, "écran verrouillé : les slides ne tournent pas", tw.deck.index === idxLocked, `${idxLocked} → ${tw.deck.index}`);
    tw.deck.duration = 0;
    td.getElementById("lock-code").value = "faux";
    td.getElementById("lock-form").dispatchEvent(new tw.Event("submit", { cancelable: true }));
    await waitFor(() => td.getElementById("lock-error").textContent !== "");
    check(g, "écran : mauvais code refusé", td.getElementById("lock-error").textContent === "Code incorrect." && !lock.hidden);
    td.getElementById("lock-code").value = "dora2026";
    td.getElementById("lock-form").dispatchEvent(new tw.Event("submit", { cancelable: true }));
    await waitFor(() => lock.hidden);
    check(g, "écran : bon code → les slides s'affichent", lock.hidden && tw.getComputedStyle(lock).display === "none");
    check(g, "écran : le code est mémorisé sur l'appareil", localStorage.getItem("matdora-site-code") === "dora2026");
    tv.remove();

    // Rechargement : plus besoin de le retaper
    tv = await load("../index.html#mock", 1280, 720);
    tw = tv.contentWindow; td = tv.contentDocument;
    await tw.refresh();
    check(g, "écran rechargé : pas de nouvelle demande", td.getElementById("lock").hidden);

    // L'admin change le code : l'écran le redemande au prochain rafraîchissement
    await tw.MatDoraStore.setSiteCode("nouveau-code");
    await tw.refresh();
    check(g, "code changé : l'écran redemande le code", !td.getElementById("lock").hidden && td.getElementById("lock-error").textContent.indexOf("Le code a changé") === 0, td.getElementById("lock-error").textContent);
    td.getElementById("lock-code").value = "nouveau-code";
    td.getElementById("lock-form").dispatchEvent(new tw.Event("submit", { cancelable: true }));
    await waitFor(() => td.getElementById("lock").hidden);
    check(g, "nouveau code accepté", td.getElementById("lock").hidden);

    // Les flèches tapées dans le champ du code ne changent pas de slide
    await tw.MatDoraStore.setSiteCode("encore-un");
    await tw.refresh();
    const idx = tw.deck.index;
    td.getElementById("lock-code").dispatchEvent(new tw.KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true }));
    check(g, "écran : taper dans le champ ne change pas de slide", tw.deck.index === idx);
    tv.remove();

    // Retirer le code depuis le dashboard
    adm.remove();
    adm = await load("../admin.html#mock,access", 1280, 900);
    aw = adm.contentWindow; ad = adm.contentDocument;
    await aw.ready;
    const removeBtn = ad.querySelector("#code-remove-box .btn.danger");
    removeBtn.click(); removeBtn.click();
    await waitFor(() => ad.getElementById("code-state").textContent.indexOf("Aucun code") === 0);
    check(g, "code retiré : site ouvert", ad.getElementById("code-state").textContent.indexOf("Aucun code") === 0);

    // Déconnexion
    ad.getElementById("logout").click();
    await waitFor(() => !ad.getElementById("login").hidden);
    check(g, "déconnexion : retour à l'écran de connexion", !ad.getElementById("login").hidden && ad.getElementById("app").hidden && !localStorage.getItem("matdora-admin"));
    adm.remove();
    localStorage.removeItem("matdora-demo");
    localStorage.removeItem("matdora-site-code");
  }

  // Vrai Supabase : seulement avec tests/run.html#live. Ne modifie rien : vérifie que tout est refusé
  // à un visiteur sans compte, et que le code du site est exigé quand il est réglé.
  async function testLive() {
    const g = "Supabase réel";
    const cfg = window.MATDORA_LIVE_CONFIG;
    check(g, "config.js branché sur Supabase", !!(cfg && cfg.supabaseUrl && cfg.supabaseKey));
    if (!cfg || !cfg.supabaseUrl) return;
    const base = cfg.supabaseUrl, key = cfg.supabaseKey;
    const anon = (path, opts) => fetch(base + path, Object.assign({}, opts || {}, {
      headers: Object.assign({ apikey: key, Authorization: "Bearer " + key }, (opts && opts.headers) || {})
    }));

    // La sécurité est-elle installée ?
    const access = await anon("/rest/v1/rpc/site_access", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: "" }) });
    check(g, "sécurité installée (setup.sql relancé)", access.ok, `HTTP ${access.status}`);
    if (!access.ok) return;
    const state = await access.json();

    // Un visiteur sans compte ne peut rien écrire
    const writes = [
      ["réglages", "/rest/v1/settings", { key: "test-securite", value: 1 }],
      ["photos", "/rest/v1/photos", { path: "test-securite.jpg" }],
      ["restos", "/rest/v1/restaurants", { name: "Test sécurité" }],
      ["propositions", "/rest/v1/lunch_options", { day: "2030-01-01", name: "Test sécurité" }],
      ["code du site", "/rest/v1/site_secret?on_conflict=id", { id: 1, code_hash: null }],
      ["admins", "/rest/v1/admins", { email: "pirate@example.com" }]
    ];
    for (const [name, path, body] of writes) {
      const r = await anon(path, { method: "POST", headers: { "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify(body) });
      check(g, `sans compte : écriture refusée (${name})`, r.status === 401 || r.status === 403, `HTTP ${r.status}`);
    }
    const del = await anon("/rest/v1/restaurants?id=not.is.null", { method: "DELETE", headers: { Prefer: "return=representation" } });
    const deleted = del.ok ? await del.json() : [];
    check(g, "sans compte : suppression impossible (restos)", !del.ok || deleted.length === 0, `HTTP ${del.status}, ${deleted.length} ligne(s)`);
    const up = await anon("/storage/v1/object/photos/test-securite.png", { method: "POST", headers: { "Content-Type": "image/png" }, body: new Blob([new Uint8Array([137, 80, 78, 71])], { type: "image/png" }) });
    check(g, "sans compte : envoi de fichier refusé", !up.ok, `HTTP ${up.status}`);
    const secret = await (await anon("/rest/v1/site_secret?select=code_hash")).json();
    check(g, "sans compte : l'empreinte du code n'est pas lisible", Array.isArray(secret) && secret.length === 0, JSON.stringify(secret).slice(0, 80));
    const admins = await (await anon("/rest/v1/admins?select=email")).json();
    check(g, "sans compte : la liste des admins n'est pas lisible", Array.isArray(admins) && admins.length === 0);

    // Code du site : sans lui, aucune donnée
    if (state.required) {
      const rows = await (await anon("/rest/v1/settings?select=key")).json();
      check(g, "code réglé : sans code, aucune donnée", Array.isArray(rows) && rows.length === 0, `${rows.length} ligne(s)`);
      const wrong = await (await anon("/rest/v1/settings?select=key", { headers: { "x-site-code": "mauvais-code-test" } })).json();
      check(g, "code réglé : avec un faux code, aucune donnée", Array.isArray(wrong) && wrong.length === 0);
    } else {
      check(g, "aucun code réglé : le site est ouvert (règle-le dans le dashboard, onglet Accès)", true);
    }

    // Connexion refusée avec un faux mot de passe
    const login = await fetch(`${base}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: key, "Content-Type": "application/json" },
      body: JSON.stringify({ email: "personne@matdora.app", password: "faux-mot-de-passe" })
    });
    check(g, "connexion avec un faux compte refusée", !login.ok, `HTTP ${login.status}`);
  }

  function report() {
    const failed = results.filter(r => !r.ok);
    const table = document.getElementById("results");
    for (const r of [...failed, ...results.filter(r => r.ok)]) {
      const tr = table.insertRow();
      tr.className = r.ok ? "pass" : "fail";
      tr.insertCell().textContent = r.ok ? "OK" : "ÉCHEC";
      tr.insertCell().textContent = r.group;
      tr.insertCell().textContent = r.name;
      tr.insertCell().textContent = r.ok ? "" : r.detail;
    }
    const s = document.getElementById("summary");
    s.textContent = failed.length ? `${failed.length} échec(s) sur ${results.length} tests` : `Tout est bon : ${results.length} tests réussis`;
    s.className = failed.length ? "fail" : "pass";
    window.testResults = { total: results.length, failed: failed.map(r => `${r.group} — ${r.name} — ${r.detail}`) };
  }

  (async () => {
    try {
      if (location.hash === "#live") {
        const src = await (await fetch("../config.js", { cache: "no-store" })).text();
        const url = /supabaseUrl:\s*"([^"]*)"/.exec(src), k = /supabaseKey:\s*"([^"]*)"/.exec(src);
        window.MATDORA_LIVE_CONFIG = { supabaseUrl: url ? url[1] : "", supabaseKey: k ? k[1] : "" };
        await testLive();
      }
      await testLogic();
      await testData();
      await testLunch();
      await testHappy();
      await testAccess();
      localStorage.removeItem("matdora-demo");
      for (const [w, h] of VIEWPORTS) await testViewport(w, h);
      localStorage.removeItem("matdora-demo");
    } catch (e) {
      check("erreur", "les tests ont planté", false, String(e));
    }
    report();
  })();
</script>
